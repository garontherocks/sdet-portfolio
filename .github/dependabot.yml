version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      test-tooling:
        patterns:
          - '@playwright/*'
          - '@percy/*'
          - 'cypress'
          - 'allure-*'
      static-analysis:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'typescript'
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0".
      # Grouping a TypeScript major with it breaks `npm ci` (see #33, #38).
      # Remove once typescript-eslint supports the next TypeScript major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
