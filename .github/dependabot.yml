version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One monthly PR for every compatible (minor/patch) update.
      # Major updates are left out of the group so each one arrives in its
      # own PR and can be reviewed for breaking changes.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0".
      # A TypeScript major breaks `npm ci` (see #33, #38).
      # Remove once typescript-eslint supports the next TypeScript major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns:
          - '*'
