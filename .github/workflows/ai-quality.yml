name: GenAI Quality Evals

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'package.json'
      - '.github/workflows/ai-quality.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'package.json'
      - '.github/workflows/ai-quality.yml'
  workflow_dispatch:
    inputs:
      run_live_eval:
        description: 'Run optional OpenAI evaluation using the repository secret'
        required: false
        default: false
        type: boolean

concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit and security tests
        run: npm run ai:test
      - name: Labeled failure-triage evaluations
        run: npm run ai:eval
      - name: Requirements-to-test smoke check
        run: npm run ai:generate-tests -- --requirement ai/examples/checkout-requirement.md --id REQ-CHECKOUT-001
      - name: Upload AI evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-evidence
          retention-days: 30
          path: |
            reports/ai-evals.json
            ai/generated/review-required/*.json
          if-no-files-found: error

  live-openai-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run live structured-output evaluation
        env:
          AI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: npm run ai:eval:live
      - uses: actions/upload-artifact@v4
        with:
          name: ai-live-eval-evidence
          retention-days: 30
          path: reports/ai-evals.json
          if-no-files-found: error
