name: Cypress Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Cypress tests
        run: npm run run --workspace=cypress
      - name: Merge Mochawesome JSON
        if: always()
        run: npm run report:merge --workspace=cypress
      - name: Generate Mochawesome HTML
        if: always()
        run: npm run report:gen --workspace=cypress
      - name: Upload Cypress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          retention-days: 30
          path: |
            cypress/reports/mochawesome/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
