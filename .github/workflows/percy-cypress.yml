name: Percy Visual Tests (Cypress)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cypress/**'
      - '.github/workflows/percy-cypress.yml'

concurrency:
  group: percy-cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  percy-cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run deterministic Cypress visual spec
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          CYPRESS_REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: npm run percy:exec --workspace=cypress
