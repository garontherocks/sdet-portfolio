name: Percy Visual Tests (Cypress)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cypress/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/percy-cypress.yml'
  pull_request:
    paths:
      - 'cypress/**'
      - '.github/workflows/percy-cypress.yml'

concurrency:
  group: percy-cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  percy-cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upload deterministic Cypress snapshots to Percy
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npm run percy:exec --workspace=cypress
