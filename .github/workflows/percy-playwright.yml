name: Percy Visual Tests (Playwright)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'playwright/**'
      - '.github/workflows/percy-playwright.yml'

concurrency:
  group: percy-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  percy-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: playwright
      - name: Run deterministic Chromium visual spec
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npm run percy:playwright --workspace=playwright
