name: k6 Performance

on:
  push:
    branches: [main]
    paths:
      - 'performance/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/perf-k6.yml'
  pull_request:
    paths:
      - 'performance/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/perf-k6.yml'
  workflow_dispatch:
    inputs:
      include_stress:
        description: 'Run the longer stress scenario'
        required: false
        default: false
        type: boolean

concurrency:
  group: k6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, load]
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg curl
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run ${{ matrix.suite }} scenario with native thresholds
        run: |
          mkdir -p reports
          k6 run performance/${{ matrix.suite }}.test.js --summary-export reports/k6_${{ matrix.suite }}_summary.json
      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.suite }}-summary
          retention-days: 30
          path: reports/k6_${{ matrix.suite }}_summary.json
          if-no-files-found: error

  stress:
    if: github.event_name == 'workflow_dispatch' && inputs.include_stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg curl
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - run: |
          mkdir -p reports
          k6 run performance/stress.test.js --summary-export reports/k6_stress_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-stress-summary
          retention-days: 30
          path: reports/k6_stress_summary.json
          if-no-files-found: error
