name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
        working-directory: playwright
      - name: Run Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/2
        working-directory: playwright
      - name: Generate Allure HTML
        if: always()
        run: npx allure generate allure-results -o allure-report --clean
        working-directory: playwright
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-shard-${{ matrix.shard }}
          retention-days: 30
          path: |
            playwright/allure-results/
            playwright/allure-report/
            playwright/test-results/
          if-no-files-found: error
