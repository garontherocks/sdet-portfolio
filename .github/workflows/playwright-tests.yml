name: Playwright Tests

on:
  push:
    paths:
      - 'playwright/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-tests.yml'
  pull_request:
    paths:
      - 'playwright/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-tests.yml'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-run:
    # Pinned: ubuntu-latest moved to 26.04 (Oct 2026), whose apt mirror
    # trickles Playwright's system deps at KB/s and blows the 15-min cap.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # apt mirror downloads for all three browsers' system deps have stalled
      # indefinitely on ubuntu-latest. Bound each HTTP fetch and retry it, and
      # cap the step so a stuck mirror fails fast instead of hanging the job.
      - name: Configure apt network timeouts
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network
      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps
        working-directory: playwright
        timeout-minutes: 15
      - name: Run Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob
        working-directory: playwright
      - name: Upload Playwright shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          retention-days: 30
          path: playwright/blob-report/*.zip
          if-no-files-found: error

  merge-playwright-report:
    if: always()
    needs: playwright-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download all Playwright shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-shard-*
          path: playwright/all-blob-reports
          merge-multiple: true
      - name: Generate merged HTML report
        run: npx playwright merge-reports --reporter=html all-blob-reports
        working-directory: playwright
      - name: Generate merged Allure results and report
        run: |
          npx playwright merge-reports --reporter=allure-playwright all-blob-reports || test -d allure-results
          npx allure generate allure-results -o allure-report --clean
        working-directory: playwright
      - name: Upload merged Playwright evidence
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-merged
          retention-days: 30
          path: |
            playwright/playwright-report/
            playwright/allure-results/
            playwright/allure-report/
          if-no-files-found: error
