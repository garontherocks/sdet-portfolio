name: Playwright Tests

on:
  push:
    paths:
      - 'playwright/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-tests.yml'
  pull_request:
    paths:
      - 'playwright/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-tests.yml'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-run:
    runs-on: ubuntu-24.04
    # Run inside the official Playwright image: browsers and their system
    # deps are preinstalled, so the job no longer depends on the Azure apt
    # mirror, which has stalled `playwright install --with-deps` past its
    # 15-minute cap on both ubuntu-26.04 and ubuntu-24.04.
    # Keep the tag in sync with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No-op when the image matches @playwright/test; if a Dependabot bump
      # gets ahead of the image tag, this fetches the browsers from the
      # Playwright CDN (system deps are already in the image, no apt).
      - name: Ensure Playwright browsers match the installed version
        run: npx playwright install
        working-directory: playwright
        timeout-minutes: 10
      - name: Run Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob
        working-directory: playwright
      - name: Upload Playwright shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          retention-days: 30
          path: playwright/blob-report/*.zip
          if-no-files-found: error

  merge-playwright-report:
    if: always()
    needs: playwright-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download all Playwright shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-shard-*
          path: playwright/all-blob-reports
          merge-multiple: true
      - name: Generate merged HTML report
        run: npx playwright merge-reports --reporter=html all-blob-reports
        working-directory: playwright
      - name: Generate merged Allure results and report
        run: |
          npx playwright merge-reports --reporter=allure-playwright all-blob-reports || test -d allure-results
          npx allure generate allure-results -o allure-report --clean
        working-directory: playwright
      - name: Upload merged Playwright evidence
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-merged
          retention-days: 30
          path: |
            playwright/playwright-report/
            playwright/allure-results/
            playwright/allure-report/
          if-no-files-found: error
