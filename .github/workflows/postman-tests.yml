name: Postman CI

on:
  push:
    branches: [main]
    paths:
      - 'postman/**'
      - '.github/workflows/postman-tests.yml'
  pull_request:
    paths:
      - 'postman/**'
      - '.github/workflows/postman-tests.yml'
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require API credential
        run: test -n "$REQRES_API_KEY"
      - name: Run collection
        run: >-
          npx newman run postman/SDET-Portfolio-ReqRes.postman_collection.json
          -e postman/SDET-Portfolio-Env.postman_environment.json
          --env-var apiKey="$REQRES_API_KEY"
          --reporters cli,junit
          --reporter-junit-export reports/newman.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-junit
          retention-days: 30
          path: reports/newman.xml
          if-no-files-found: error
