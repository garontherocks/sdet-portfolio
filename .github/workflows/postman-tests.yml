name: Postman CI

on:
  push:
    branches: [main]
    paths:
      - 'postman/**'
      - '.github/workflows/postman-tests.yml'
  pull_request:
    paths:
      - 'postman/**'
      - '.github/workflows/postman-tests.yml'
  workflow_dispatch:

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install root CLI dependencies only
        run: npm ci --ignore-scripts --workspaces=false
      - name: Run collection
        run: >-
          npx --no-install newman run postman/SDET-Portfolio-ReqRes.postman_collection.json
          -e postman/SDET-Portfolio-Env.postman_environment.json
          --reporters cli,junit
          --reporter-junit-export reports/newman.xml
      - name: Upload Newman JUnit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postman-junit
          retention-days: 30
          path: reports/newman.xml
          if-no-files-found: warn
