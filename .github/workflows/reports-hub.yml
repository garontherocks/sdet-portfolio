name: Reports Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: reports-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-quality-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cypress evidence
        run: npm run run --workspace=cypress
      - name: Merge Cypress results
        if: always()
        run: npm run report:merge --workspace=cypress

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: playwright
      - name: Playwright evidence
        run: npx playwright test --project=chromium
        working-directory: playwright

      - name: Lighthouse evidence
        run: npm run lhci

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg curl
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: k6 smoke evidence
        run: |
          mkdir -p reports
          k6 run performance/smoke.test.js --summary-export reports/k6_smoke_summary.json

      - name: Aggregate quality evidence
        if: always()
        run: node reports/aggregator/combine-metrics.js
      - name: Enforce required evidence and thresholds
        if: always()
        run: node scripts/quality-gates.js

      - name: Build dashboard
        if: always()
        run: |
          cp reports/dashboards/dashboard.html reports/dashboards/index.html
          cp reports/quality.json reports/dashboards/quality.json
      - name: Upload complete quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-dashboard
          retention-days: 30
          path: |
            reports/quality.json
            reports/dashboards/
            cypress/reports/mochawesome/
            playwright/allure-results/
            .lighthouseci/
            reports/k6_smoke_summary.json
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/dashboards

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build-quality-evidence
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@v4
